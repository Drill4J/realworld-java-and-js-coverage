plugins {
    id 'java'
    id("com.epam.drill.integration.cicd") version "0.10.1"
}

group 'com.epam'
version '1.0-SNAPSHOT'

allprojects {

    repositories {
        mavenCentral()
    }

    apply plugin: 'java'
    apply plugin: 'com.epam.drill.integration.cicd'

    dependencies {
        implementation 'io.rest-assured:rest-assured:4.3.3'
        implementation 'org.junit.jupiter:junit-jupiter-api:5.6.0'
        runtimeOnly 'org.junit.jupiter:junit-jupiter-engine'
        implementation 'com.codeborne:selenide:5.19.0'
        implementation 'org.slf4j:slf4j-simple:1.7.32'
    }

        
    drill {
        agent {
            version = "0.10.3"
            agentMode = "JAVA"
            logLevel = "DEBUG"
        }

        groupId = "realworld"
        appId = "backend"
        buildVersion = project.version
        
        packagePrefixes = [
            "com/realworld/springmongo",
        ]

        coverage {
            enabled = true
        }

        testTracing {
            enabled = true
            perTestSession = true
            perTestLaunch = true
        }

        additionalParams = [
            "devToolsProxyAddress": "http://localhost:8093",
            "devtoolsAddressReplaceLocalhost": "host.docker.internal",
        ]
    }

}
